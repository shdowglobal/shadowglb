<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Operator Stack missions, handoffs and Vault</title><desc id="desc">Preview of guided missions, structured handoffs and local Vault.</desc>
  <rect width="1440" height="900" fill="#080809"/><rect x="45" y="44" width="1350" height="812" rx="24" fill="#0e0e10" stroke="#28282c"/>
  <text x="86" y="90" fill="#f2f2f3" font-family="Arial" font-size="18" font-weight="700" letter-spacing="2">SHADOW <tspan fill="#00e676">// MISSION CONTROL</tspan></text>
  <text x="86" y="158" fill="#00e676" font-family="monospace" font-size="12" letter-spacing="3">MISSIONS // HANDOFFS // VAULT</text>
  <text x="86" y="214" fill="#f2f2f3" font-family="Arial" font-size="45" font-weight="700">Keep the work moving.</text>
  <text x="86" y="253" fill="#a8a8ad" font-family="Arial" font-size="19">Run a guided sequence, preserve context between roles, then save the output locally.</text>
  <g transform="translate(86 309)" font-family="Arial">
    <rect width="390" height="438" rx="16" fill="#121214" stroke="#26262a"/><text x="24" y="34" fill="#00e676" font-family="monospace" font-size="12">01 // MISSION LIBRARY</text><text x="24" y="78" fill="#f2f2f3" font-size="26" font-weight="700">6 guided missions</text>
    <g fill="#171719" stroke="#2a2a2e"><rect x="24" y="104" width="342" height="48" rx="9"/><rect x="24" y="164" width="342" height="48" rx="9"/><rect x="24" y="224" width="342" height="48" rx="9"/><rect x="24" y="284" width="342" height="48" rx="9"/><rect x="24" y="344" width="342" height="48" rx="9"/></g>
    <g fill="#b6b6ba" font-size="14"><text x="42" y="134">Validate an idea</text><text x="42" y="194">Build an offer</text><text x="42" y="254">Build a digital product</text><text x="42" y="314">Find clients</text><text x="42" y="374">Plan content + diagnose sales</text></g>
    <g transform="translate(413)"><rect width="390" height="438" rx="16" fill="#121214" stroke="#00e676" stroke-opacity=".34"/><text x="24" y="34" fill="#00e676" font-family="monospace" font-size="12">02 // CONTEXT RELAY</text><text x="24" y="78" fill="#f2f2f3" font-size="26" font-weight="700">Structured handoffs</text><text x="24" y="117" fill="#8c8c92" font-size="15">FROM OPERATOR</text><rect x="24" y="132" width="342" height="43" rx="8" fill="#08080a" stroke="#2a2a2e"/><text x="42" y="159" fill="#d7d7da" font-size="14">RESEARCH</text><text x="24" y="205" fill="#8c8c92" font-size="15">RESULT RETURNED BY YOUR AI</text><rect x="24" y="220" width="342" height="92" rx="8" fill="#08080a" stroke="#2a2a2e"/><text x="42" y="250" fill="#5f5f65" font-size="13">Evidence, decisions and unknowns…</text><text x="24" y="343" fill="#8c8c92" font-size="15">HAND OFF TO</text><rect x="24" y="358" width="206" height="48" rx="8" fill="#08080a" stroke="#2a2a2e"/><text x="42" y="388" fill="#d7d7da" font-size="14">OFFER</text><rect x="242" y="358" width="124" height="48" rx="8" fill="#00e676"/><text x="304" y="388" text-anchor="middle" fill="#04120a" font-size="13" font-weight="700">GENERATE</text></g>
    <g transform="translate(826)"><rect width="390" height="438" rx="16" fill="#121214" stroke="#26262a"/><text x="24" y="34" fill="#00e676" font-family="monospace" font-size="12">03 // SEARCHABLE VAULT</text><text x="24" y="78" fill="#f2f2f3" font-size="26" font-weight="700">Saved local work</text><rect x="24" y="104" width="342" height="43" rx="8" fill="#08080a" stroke="#2a2a2e"/><text x="42" y="131" fill="#5f5f65" font-size="13">Search vault…</text>
      <g><rect x="24" y="167" width="342" height="70" rx="9" fill="#171719" stroke="#2a2a2e"/><text x="42" y="195" fill="#00e676" font-family="monospace" font-size="10">RESEARCH</text><text x="42" y="220" fill="#d7d7da" font-size="14">Market evidence map</text><rect x="24" y="249" width="342" height="70" rx="9" fill="#171719" stroke="#2a2a2e"/><text x="42" y="277" fill="#00e676" font-family="monospace" font-size="10">OFFER</text><text x="42" y="302" fill="#d7d7da" font-size="14">Positioning and promise</text><rect x="24" y="331" width="342" height="70" rx="9" fill="#171719" stroke="#2a2a2e"/><text x="42" y="359" fill="#00e676" font-family="monospace" font-size="10">CONTENT</text><text x="42" y="384" fill="#d7d7da" font-size="14">30-day content plan</text></g>
    </g>
  </g>
  <text x="720" y="806" text-anchor="middle" fill="#66666c" font-family="monospace" font-size="12" letter-spacing="2">PROJECT DATA STAYS LOCAL • EXPORT / IMPORT BACKUP INCLUDED</text>
</svg>

