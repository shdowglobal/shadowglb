<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Operator Stack V1 specialist operator roster</title><desc id="desc">Preview of the eight specialist AI operator roles.</desc>
  <rect width="1440" height="900" fill="#080809"/><rect x="45" y="44" width="1350" height="812" rx="24" fill="#0e0e10" stroke="#28282c"/>
  <text x="86" y="90" fill="#f2f2f3" font-family="Arial" font-size="18" font-weight="700" letter-spacing="2">SHADOW <tspan fill="#00e676">// OPERATOR STACK</tspan></text>
  <text x="86" y="157" fill="#00e676" font-family="monospace" font-size="12" letter-spacing="3">OPERATORS // 8 DEPLOYED</text>
  <text x="86" y="214" fill="#f2f2f3" font-family="Arial" font-size="45" font-weight="700">Operator Roster</text>
  <text x="86" y="253" fill="#a8a8ad" font-family="Arial" font-size="19">One job, explicit rules and a defined output standard for every role.</text>
  <g font-family="Arial">
    <g transform="translate(86 306)"><rect width="296" height="190" rx="14" fill="#121214" stroke="#00e676" stroke-opacity=".34"/><text x="23" y="34" fill="#00e676" font-family="monospace" font-size="12">OPERATOR 01</text><text x="23" y="82" fill="#f2f2f3" font-size="27" font-weight="700">COMMAND</text><text x="23" y="118" fill="#8c8c92" font-size="15">Routes the objective.</text><text x="23" y="145" fill="#8c8c92" font-size="15">Chooses who works next.</text></g>
    <g transform="translate(406 306)"><rect width="296" height="190" rx="14" fill="#121214" stroke="#26262a"/><text x="23" y="34" fill="#6f6f75" font-family="monospace" font-size="12">OPERATOR 02</text><text x="23" y="82" fill="#f2f2f3" font-size="27" font-weight="700">RESEARCH</text><text x="23" y="118" fill="#8c8c92" font-size="15">Separates facts, evidence,</text><text x="23" y="145" fill="#8c8c92" font-size="15">assumptions and unknowns.</text></g>
    <g transform="translate(726 306)"><rect width="296" height="190" rx="14" fill="#121214" stroke="#26262a"/><text x="23" y="34" fill="#6f6f75" font-family="monospace" font-size="12">OPERATOR 03</text><text x="23" y="82" fill="#f2f2f3" font-size="27" font-weight="700">OFFER</text><text x="23" y="118" fill="#8c8c92" font-size="15">Turns evidence into a clear,</text><text x="23" y="145" fill="#8c8c92" font-size="15">credible value proposition.</text></g>
    <g transform="translate(1046 306)"><rect width="296" height="190" rx="14" fill="#121214" stroke="#26262a"/><text x="23" y="34" fill="#6f6f75" font-family="monospace" font-size="12">OPERATOR 04</text><text x="23" y="82" fill="#f2f2f3" font-size="27" font-weight="700">PRODUCT</text><text x="23" y="118" fill="#8c8c92" font-size="15">Scopes and structures the</text><text x="23" y="145" fill="#8c8c92" font-size="15">smallest complete build.</text></g>
    <g transform="translate(86 520)"><rect width="296" height="190" rx="14" fill="#121214" stroke="#26262a"/><text x="23" y="34" fill="#6f6f75" font-family="monospace" font-size="12">OPERATOR 05</text><text x="23" y="82" fill="#f2f2f3" font-size="27" font-weight="700">CONTENT</text><text x="23" y="118" fill="#8c8c92" font-size="15">Builds content from the offer,</text><text x="23" y="145" fill="#8c8c92" font-size="15">proof and customer reality.</text></g>
    <g transform="translate(406 520)"><rect width="296" height="190" rx="14" fill="#121214" stroke="#26262a"/><text x="23" y="34" fill="#6f6f75" font-family="monospace" font-size="12">OPERATOR 06</text><text x="23" y="82" fill="#f2f2f3" font-size="27" font-weight="700">OUTREACH</text><text x="23" y="118" fill="#8c8c92" font-size="15">Creates relevant, specific</text><text x="23" y="145" fill="#8c8c92" font-size="15">prospecting messages.</text></g>
    <g transform="translate(726 520)"><rect width="296" height="190" rx="14" fill="#121214" stroke="#26262a"/><text x="23" y="34" fill="#6f6f75" font-family="monospace" font-size="12">OPERATOR 07</text><text x="23" y="82" fill="#f2f2f3" font-size="27" font-weight="700">SALES</text><text x="23" y="118" fill="#8c8c92" font-size="15">Qualifies fit and handles</text><text x="23" y="145" fill="#8c8c92" font-size="15">objections without pressure.</text></g>
    <g transform="translate(1046 520)"><rect width="296" height="190" rx="14" fill="#121214" stroke="#26262a"/><text x="23" y="34" fill="#6f6f75" font-family="monospace" font-size="12">OPERATOR 08</text><text x="23" y="82" fill="#f2f2f3" font-size="27" font-weight="700">ANALYST</text><text x="23" y="118" fill="#8c8c92" font-size="15">Reads outcomes and identifies</text><text x="23" y="145" fill="#8c8c92" font-size="15">the next measurable move.</text></g>
  </g>
  <rect x="86" y="756" width="1256" height="62" rx="11" fill="#101512" stroke="#00e676" stroke-opacity=".28"/><text x="714" y="794" text-anchor="middle" fill="#00e676" font-family="monospace" font-size="13" letter-spacing="2">COPY-READY BRIEFINGS FOR CHATGPT • CLAUDE • SUPPORTED CODEX WORKFLOWS</text>
</svg>

